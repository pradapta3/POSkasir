# Konfigurasi "bootstrap" — HTTP saja, dipakai SEBELUM sertifikat HTTPS
# ada (Certbot butuh server HTTP yang sudah jalan untuk verifikasi domain).
# Setelah sertifikat berhasil didapat, ganti dengan https.conf — lihat
# DOCKER.md langkah 8.
server {
    listen 80;
    server_name mbayar.my.id www.mbayar.my.id;
    root /var/www/html/public;

    index index.php;
    charset utf-8;

    # Dipakai Certbot untuk memverifikasi kepemilikan domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
