# Konfigurasi produksi — HTTP redirect ke HTTPS + server HTTPS. Dipakai
# SETELAH sertifikat dari Certbot berhasil didapat (lihat DOCKER.md
# langkah 8) — sebelum itu, sertifikat di bawah belum ada dan nginx akan
# gagal start.
server {
    listen 80;
    server_name mbayar.my.id www.mbayar.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mbayar.my.id www.mbayar.my.id;
    root /var/www/html/public;

    ssl_certificate     /etc/letsencrypt/live/mbayar.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mbayar.my.id/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    client_max_body_size 20M;
}
