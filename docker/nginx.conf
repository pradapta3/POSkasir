server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache panjang dibatasi ke direktori yang isinya benar-benar file statis.
    # Aturan berbasis ekstensi (~* \.js$ dan sejenisnya) tidak dipakai karena
    # ikut menangkap URL yang dilayani PHP — /livewire/livewire.min.js adalah
    # route Laravel, bukan file di disk, dan akan berakhir 404 kalau nginx
    # mencoba melayaninya sebagai file statis.

    # Nama file aset Vite mengandung hash isinya, jadi aman di-cache selamanya.
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Gambar produk & logo hasil upload (public/storage -> storage/app/public).
    location /storage/ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
}
